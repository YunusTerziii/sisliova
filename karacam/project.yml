# XcodeGen tanımı: `xcodegen generate` → Karacam.xcodeproj
name: Karacam
options:
  bundleIdPrefix: com.yunusterzi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  KaracamCore:
    path: .
targets:
  Karacam:
    type: application
    platform: iOS
    sources:
      - path: App/Karacam
    dependencies:
      - package: KaracamCore
        product: KaracamCore
      - package: KaracamCore
        product: KaracamAppModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunusterzi.karacam
        PRODUCT_NAME: Karacam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Karaçam
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.role-playing-games
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
schemes:
  Karacam:
    build:
      targets:
        Karacam: all
    run:
      config: Debug
      storeKitConfiguration: App/Karacam.storekit
    test:
      config: Debug
      targets:
        - package: KaracamCore/KaracamCoreTests
        - package: KaracamCore/KaracamAppModelTests
    archive:
      config: Release
