<html lang="tr">
<head>

<style>
  :root {
    --kagit: #F3EAD9;
    --kagit-acik: #FBF6EC;
    --murekkep: #292621;
    --kursun: #77736A;
    --kirmizi: #BE453C;
    --yesil: #56836A;
    --cizgi: rgba(41, 38, 33, .09);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--kagit);
    background-image:
      linear-gradient(var(--cizgi) 1px, transparent 1px),
      linear-gradient(90deg, var(--cizgi) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--murekkep);
    font: 400 17px/1.45 "Nunito", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .oyun { max-width: 480px; min-height: 100%; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; }
  .el { font-family: "Patrick Hand", "Nunito", cursive; font-weight: 400; }
  .test { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--kirmizi); text-align: center; margin-bottom: 6px; }

  /* Sayaçlar */
  .hud { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 6px; }
  .hud > div { border: 1.5px dashed var(--kursun); border-radius: 4px; padding: 4px 8px; background: rgba(251, 246, 236, .8); min-width: 0; }
  .hud .e { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; color: var(--kursun); }
  .hud .d { font-weight: 800; font-size: 17px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud .kasa .d { color: var(--yesil); }
  .hud .kasa.dusuk .d { color: var(--kirmizi); }
  .cubuk { height: 6px; border: 1.3px solid var(--murekkep); border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .cubuk span { display: block; height: 100%; width: 0; transition: width .6s ease-out; }
  .guven .cubuk span { background: var(--yesil); }
  .suphe .cubuk span { background: var(--kirmizi); }
  .hud .titre { animation: titre .45s; }
  @keyframes titre { 25% { transform: translateY(-2px) scale(1.06); } 75% { transform: translateY(1px); } }
  .zaman { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 6px; }
  .zaman .an { font-family: "Patrick Hand", cursive; font-size: 26px; }
  .defter-ac { font: 800 13px "Nunito", sans-serif; color: var(--murekkep); background: var(--kagit-acik); border: 1.5px solid var(--murekkep); border-radius: 4px; padding: 5px 12px; cursor: pointer; }

  /* Kart */
  .kart {
    position: relative; flex: 1;
    background: var(--kagit-acik);
    border: 1.5px solid var(--murekkep);
    border-radius: 3px 6px 4px 5px;
    padding: 20px 16px 16px;
    box-shadow: 3px 4px 0 rgba(41, 38, 33, .12);
    display: flex; flex-direction: column;
    animation: birak .35s ease-out;
  }
  @keyframes birak { from { opacity: 0; transform: translateY(14px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
  .bant { position: absolute; top: -11px; left: 50%; width: 86px; height: 22px; transform: translateX(-50%) rotate(-2deg); background: rgba(233, 221, 198, .9); border: 1px solid rgba(41, 38, 33, .12); }
  .kim { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .yuz {
    width: 64px; height: 64px; flex: none; border-radius: 50%;
    border: 1.8px solid var(--murekkep); background: var(--kagit);
    display: grid; place-items: center; overflow: hidden;
    font-family: "Patrick Hand", cursive; font-size: 30px;
  }
  .yuz img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .kim .ad { font-weight: 800; font-size: 16px; }
  .kim .rol { font-size: 13px; color: var(--kursun); }
  .metin { font-family: "Patrick Hand", cursive; font-size: 27px; line-height: 1.18; margin: 4px 0 18px; }
  .secenekler { margin-top: auto; display: grid; gap: 10px; }
  .secim {
    width: 100%; text-align: left; cursor: pointer;
    font: 800 17px/1.25 "Nunito", sans-serif; color: var(--murekkep);
    padding: 13px 14px; border: 2px solid var(--murekkep); border-radius: 6px 4px 7px 5px;
    background: var(--kagit); box-shadow: 3px 3px 0 rgba(41, 38, 33, .2);
  }
  .secim:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(41, 38, 33, .2); }
  .secim .etki { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12.5px; font-weight: 800; }
  .etki span { border: 1.3px solid currentColor; border-radius: 10px; padding: 0 7px; }
  .etki .iyi { color: var(--yesil); }
  .etki .kotu { color: var(--kirmizi); }
  .etki .notr { color: var(--kursun); }
  .ana { background: var(--murekkep); color: var(--kagit); box-shadow: 3px 3px 0 var(--kirmizi); text-align: center; }

  .sonuc-satir { font-size: 15px; padding: 6px 0; border-bottom: 1px dashed var(--kursun); display: flex; justify-content: space-between; gap: 10px; }
  .sonuc-satir:last-child { border-bottom: 0; }
  .sonuc-satir > b { white-space: nowrap; }
  .eski { text-decoration: line-through; text-decoration-color: var(--kirmizi); color: var(--kursun); margin-right: 6px; }
  .kucuk { font-size: 13px; color: var(--kursun); }
  .giris input {
    width: 100%; font: 600 18px "Nunito", sans-serif; padding: 12px; margin: 6px 0 14px;
    border: 2px solid var(--murekkep); border-radius: 6px; background: var(--kagit); color: var(--murekkep);
  }
  .liste { margin: 6px 0 12px; padding-left: 18px; }
  .ipucu-listesi li { margin-bottom: 4px; }
  .onceki { font-size: 14.5px; line-height: 1.35; color: var(--kursun); font-style: italic; border-left: 3px solid var(--kursun); padding: 2px 0 2px 10px; margin: 0 0 12px; }
  .uyari { font-size: 13px; font-weight: 800; color: var(--kirmizi); margin: 0 0 10px; }
  .baslik-k { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--kursun); margin: 16px 0 4px; text-transform: uppercase; }
  .baslik-k:first-of-type { margin-top: 4px; }
  .etiket { font-size: 11px; font-weight: 800; border: 1.2px solid currentColor; border-radius: 8px; padding: 0 6px; margin-right: 6px; color: var(--kursun); white-space: nowrap; }
  .ipucu-listesi { list-style: none; padding-left: 0; }
  .ipucu-listesi li { font-size: 14.5px; line-height: 1.4; margin-bottom: 8px; }
  .ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ikili .secim { text-align: center; }
  .gorsel { display: flex; gap: 10px; justify-content: center; margin: -6px 0 14px; }
  .gorsel img { max-height: 110px; max-width: 48%; object-fit: contain; }
  .harita { height: 170px; margin: 0 0 12px; border: 1.5px solid var(--murekkep); border-radius: 3px; overflow: hidden; }
  .harita img { width: 100%; height: 100%; object-fit: cover; object-position: center 48%; display: block; }
  .mini { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1.3px solid var(--murekkep); }
  .anket { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .anket .secim { text-align: center; padding: 10px; }
  .anket .secim:disabled { opacity: .55; }
  .anket .secim.secili { opacity: 1; background: var(--murekkep); color: var(--kagit); }
  .ozet { font-family: "Patrick Hand", cursive; font-size: 22px; line-height: 1.2; margin: 4px 0 6px; }
  @media (prefers-reduced-motion: reduce) { .kart, .hud .titre { animation: none; } .cubuk span { transition: none; } }
</style>
</head>

<script>
  const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSd0SNr2Fh3Kw6c2q5Bkcqk5O2uXAXyg1T-l3IQJ9igTrppFhw/viewform";
  const KAYIT = "karacam-demo-v2", ESKI_KAYIT = "karacam-demo-v1";

  // ===== MOTOR BAŞI (oyun kuralları; denge simülasyonu da bu bölümü kullanır) =====
  // Güven akşam gelirini, baskı akşam kaybını belirler
  const GUVEN_YUKSEK = 60, GUVEN_DUSUK = 25, SUPHE_IZLEME = 50;
  const HEDEF_KASA = 150000;
  const ANLAR = ["sabah", "ogle", "gece"];

  const KISI = {
    muhtar: { ad: "Muhtar Selim", rol: "Karaçam muhtarı", resim: "img/selim.webp" },
    elif: { ad: "Elif", rol: "Köyün en genci, 19", resim: "img/elif.webp" },
    halil: { ad: "Bekçi Halil", rol: "Kaplıcanın gece bekçisi", resim: "img/halil.webp" },
    sevim: { ad: "Sayman Sevim", rol: "Kooperatifin saymanı", resim: "img/sevim.webp" },
    nermin: { ad: "Nermin", rol: "Sisliova'dan, market sahibi", resim: "img/nermin.webp" },
    rauf: { ad: "Rauf", rol: "Sisliova'dan, tamirci", resim: "img/rauf.webp" },
    not: { ad: "Kapının altında bir not", rol: "İmzasız", harf: "?" },
    haber: { ad: "Sisliova'dan haber", rol: "Komşu kasaba, dizinin geçtiği yer", harf: "✉" },
    mektup: { ad: "Alacaklının avukatı", rol: "Resmî ihtar", harf: "!" },
    araba: { ad: "Siyah araba", rol: "Köyün girişinde", resim: "img/araba.webp" },
    avukat: { ad: "Şirket avukatı", rol: "Şehirden geldi", resim: "img/avukat.webp" },
    nine: { ad: "Hatice Nine", rol: "Köyün en yaşlısı", resim: "img/nine.webp" },
    kamyon: { ad: "Kamyon şoförü", rol: "Köprünün başında", resim: "img/kamyon.webp" }
  };

  // Her oyunun başında biri hain seçilir. Hiçbir iz tek başına kimseyi göstermez:
  // her iz iki şüpheliye uyar (kume); iki izi birleştiren oyuncu tek kişiye iner.
  const SUPHELILER = ["selim", "halil", "sevim"];
  const HAIN = {
    selim: { ad: "Muhtar Selim", ini: "Muhtar Selim'i", bilinen: "Erkek. Kooperatif ofisinin iki anahtarından biri onda. Kaplıcanın arka odasına anahtarı yok." },
    halil: { ad: "Bekçi Halil", ini: "Bekçi Halil'i", bilinen: "Erkek. Ofise anahtarı yok. Arka odanın bekçi anahtarı hep belinde." },
    sevim: { ad: "Sayman Sevim", ini: "Sayman Sevim'i", bilinen: "Kadın. Ofisin öbür anahtarı onda. Eski kaplıca hesapları arka odada durduğu için oranın da anahtarı var." }
  };
  const OZELLIK = { erkek: ["selim", "halil"], ofis: ["selim", "sevim"], arka: ["halil", "sevim"] };
  const uyar = (o, oz) => OZELLIK[oz].includes(o.hain);

  // İpucu türleri: belge, kopya, tanik (kopuk sayfa çözümü için üçü gerekir), iz ve masum (kişilerle ilgili)
  const ip = (id, tur, metin, kisi, kume) => ({ id, tur, metin, kisi, kume });
  const masum = (id, metin, kisi) => ip(id, "masum", metin, kisi, SUPHELILER.filter(k => k !== kisi));
  const IP = {
    sayfa: ip("sayfa", "belge", "Kooperatif defterinin 12. sayfası kopuk. Sayfaları Sayman Sevim numaralıyor."),
    plaka: ip("plaka", "tanik", "Köprüde duran arabanın plakası şehirde bir hukuk bürosuna kayıtlı."),
    notYazi: ip("not-yazi", "iz", "Not sende duruyor: eğik bir yazı, kurşun kalemle."),
    dolap: ip("dolap", "iz", "Kopuk sayfa dolaplarda yok. Biri yanında taşıyor."),
    bastirma: ip("bastirma", "kopya", "Kopuk sayfadan sonraki sayfada kalem bastırma izi okunuyor: \"Kooperatif adına satış yetkisi\"."),
    arkaOda: ip("arka-oda", "kopya", "Kaplıcanın arka odasında kopuk sayfanın karbon kopyası: \"Kooperatif adına satış yetkisi. İmza atıldı.\""),
    halilKopya: ip("halil-kopya", "kopya", "Arka odaya bırakılan kâğıt bir satış yetkisinin kopyası: \"Kooperatif adına. İmza atıldı.\""),
    halilMasum: masum("halil-masum", "Halil siyah arabayı takip etmiş, bulduğu kâğıdı sana getirdi.", "halil"),
    elif: ip("elif", "tanik", "Elif, gece kooperatifin arkasında birinin telefonda \"İmzaladım, gerisi sizde\" dediğini duydu. Yüzünü görmedi.")
  };
  // Hainin özelliğine uyan iz ya da kimseyi elemeyen yansız bilgi
  const sesIzi = o => uyar(o, "erkek")
    ? ip("ses", "iz", "Elif bir şey daha hatırladı: konuşan bir erkekti, sesi kalındı.", null, OZELLIK.erkek)
    : ip("ses", "iz", "Elif çok düşündü: konuşan fısıldıyordu, kadın mı erkek mi anlayamadı.");
  const notIzi = o => uyar(o, "ofis")
    ? ip("not-kagit", "iz", "Notun kâğıdı ofisteki makbuz koçanından koparılmış. O koçan ofisten hiç çıkmaz.", null, OZELLIK.ofis)
    : ip("not-kagit", "iz", "Notun kâğıdı, köyde her evde bulunan okul defterlerinden birinden koparılmış.");
  const zarfIzi = (o, kim) => uyar(o, "arka")
    ? ip("zarf", "iz", kim + " arabadaki adama kaplıcanın arka odasının penceresinden bir zarf uzatıldı. Uzatan içerideydi.", null, OZELLIK.arka)
    : ip("zarf", "iz", kim + " zarf arka odanın önündeki taşın altına bırakılmıştı. Bırakanın içeri girmesi gerekmemiş.");
  const halilGece = o => o.hain === "halil" ? [] : [masum("halil-gece", "Siyah arabanın biraz gerisinde Halil vardı. O da arabayı takip ediyordu.", "halil")];
  const sevimDefter = o => o.hain === "sevim" ? [] : [
    ip("sevim-kopya", "kopya", "Kopuk sayfa Sevim'deymiş. Üstünde bir satış yetkisi taslağı var: \"Kooperatif adına. İmza atıldı.\""),
    masum("sevim-defter", "Sevim sayfayı kendisi koparmış: \"Biri üstüne satış yetkisi yazmıştı, kanıt olsun diye sakladım.\"", "sevim")];

  const bay = (o, ad) => !!o.bayraklar[ad];
  const gelirVar = (o, kaynak) => o.gelirler.some(g => g.kaynak === kaynak);

  // Kart alanları: id, gun, an, kim, metin, a, b; isteğe bağlı kosul (o => bool), yedek, ipucu (her seçimde), gorsel (mekân çizimleri)
  // Seçenek alanları: kasa, guven, suphe, gelir {ad, tutar, kaynak}, gelirSil (kaynak), bayrak, ipucu, not (seçimden sonraki cümle), son, dinamik (o => alanlar)
  const DESTE = [
    { id: "g1-sabah", gun: 1, an: "sabah", kim: "muhtar", metin: "Halanın yerine geçen sen misin? Kooperatif bu akşam toplanıyor. Gelecek misin?",
      a: { yazi: "Gelirim", guven: 5, not: "Selim seni toplantıda herkese tanıttı. İlk kez biri sana \"kooperatifin başı\" dedi." },
      b: { yazi: "Önce defterlere bakarım", guven: -3, bayrak: "defterGordu", ipucu: [IP.sayfa], not: "Toplantıya gitmedin. Defterde bir sayfanın eksik olduğunu fark ettin." } },
    { id: "g1-ogle", gorsel: ["img/kaplica.webp", "img/ari.webp"], gun: 1, an: "ogle", kim: "elif", metin: "Bu hafta ancak bir işi ayağa kaldırabiliriz, elimiz ikisine yetmez. Kaplıca mı, arı evi mi?",
      a: { yazi: "Kaplıca", kasa: -15000, suphe: 5, bayrak: "kaplica", gelir: { ad: "Kaplıca", tutar: 6000, kaynak: "kaplica" },
        not: "Kaplıcanın bacası tüttü. Şehirde \"Karaçam'da para var\" diye konuşulmaya başlandı." },
      b: { yazi: "Arı evi", kasa: -8000, guven: 3, bayrak: "ari", gelir: { ad: "Arı evi", tutar: 2500, kaynak: "ari" },
        not: "Hatice Nine eski kovanların yerini gösterdi. Köylüler kendi kovanlarını getirdi." } },
    { id: "g1-gece", gun: 1, an: "gece", kim: "halil", metin: "Halan kaplıcanın yedek anahtarını bana emanet etti. Kimseye vermem, sana da vermem.",
      a: { yazi: "Anahtar benim hakkım", guven: -5, bayrak: "anahtar", not: "Halil yedek anahtarı masaya bıraktı ve tek kelime etmeden çıktı. Kendi anahtarı hâlâ belinde. Arka oda artık sana da açık." },
      b: { yazi: "Sende kalsın", guven: 4, bayrak: "halilDestek", not: "Halil başını salladı: \"Gece bir şey görürsem sana söylerim.\"" } },

    { id: "g2-sabah-ari", gorsel: ["img/ari.webp"], gun: 2, an: "sabah", kim: "nermin", kosul: o => bay(o, "ari"), metin: "Arı evini açmışsın. Marketime düzenli bal lazım, alırım. Ama fiyatı ben koyarım.",
      a: { yazi: "Anlaştık", guven: 2, gelir: { ad: "Nermin'in bal siparişi", tutar: 1500, kaynak: "ari" }, not: "Nermin defterine yazdı: her hafta Karaçam balı." },
      b: { yazi: "Bu haftakini peşin ver", kasa: 3000, guven: -2, not: "Nermin parayı saydı: \"Sonrasına bakarız.\"" } },
    { id: "g2-sabah-stok", gun: 2, an: "sabah", kim: "nermin", yedek: true, metin: "Kooperatifin deposunda geçen yıldan kalan bal varmış. Peşin alırım, ama fiyatı ben koyarım.",
      a: { yazi: "Sat", kasa: 3000, guven: -2, not: "Köylünün kışlık balı Sisliova'ya gitti. Hatice Nine kaşlarını çattı." },
      b: { yazi: "Kışa kalsın", guven: 2, not: "Bal depoda kaldı. Köylü buna sevindi." } },
    { id: "g2-ogle", gun: 2, an: "ogle", kim: "rauf", metin: "Köprünün demirleri çürümüş. Otomobil geçer ama kamyon geçemez. Tamiri 12 bin.",
      a: { yazi: "Tamir et", kasa: -12000, suphe: -3, bayrak: "kopru", not: "Rauf'un faturası alacaklıya da gitti: köy yatırım yapıyor, demek ki ciddi." },
      b: { yazi: "Bekle", guven: -3, not: "Halil köprünün başına bir tabela astı: \"Ağır vasıta geçemez.\"" } },
    { id: "g2-gece", gun: 2, an: "gece", kim: "halil",
      metin: o => bay(o, "anahtar") ? "Gece köprüde şehir plakalı bir araba durdu. Plakasını yazdım. Anahtarı aldın ya, bunu da sen bil." : "Gece köprüde şehir plakalı bir araba durdu. Plakasını yazdım. Sorayım mı?",
      a: { yazi: "Tanıdıklara sor", suphe: 5, ipucu: [IP.plaka], not: "Plakayı tanıdıklara sordunuz. Haber şehirdeki aracıya kadar gitti." },
      b: { yazi: "Karışma", suphe: -2, not: "Kâğıdı çekmeceye koydun. Araba bir daha köprüde durmadı." } },

    { id: "g3-sabah", gun: 3, an: "sabah", kim: "elif", metin: "Köyün videosunu çekip paylaşalım mı? Bence çok izlenir.",

  function siradakiKart(o) {
    const an = ANLAR[o.anIndex];
    const adaylar = DESTE.filter(k => k.gun === o.gun && k.an === an);
    return adaylar.find(k => !k.yedek && (!k.kosul || k.kosul(o))) || adaylar.find(k => k.yedek);
  }
  // Seçeneği o anki duruma göre çözer: dinamik değerler, ipucu ve not metinleri
  function cozSecim(kart, s, o) {
    const e = Object.assign({}, s, s.dinamik ? s.dinamik(o) : {});
    const ipler = l => typeof l === "function" ? l(o) : (l || []);
    const kendi = ipler(e.ipucu);
    e.ipucu = ipler(kart.ipucu).concat(kendi);
    e.yeniIpucu = kendi.filter(i => !o.ipuclari.some(x => x.id === i.id)).length;
    if (typeof e.not === "function") e.not = e.not(o);
    return e;
  }
  function uygula(e, o) {
    const sinirla = x => Math.max(0, Math.min(100, x));
    if (e.kasa) o.kasa += e.kasa;
    if (e.guven) o.guven = sinirla(o.guven + e.guven);
    if (e.suphe) o.suphe = sinirla(o.suphe + e.suphe);
    e.ipucu.forEach(i => { if (!o.ipuclari.some(x => x.id === i.id)) o.ipuclari.push(i); });
    [].concat(e.bayrak || []).forEach(b => o.bayraklar[b] = true);
    if (e.gelirSil) o.gelirler = o.gelirler.filter(g => g.kaynak !== e.gelirSil);
    if (e.gelir) o.gelirler.push(e.gelir);
    o.not = e.not || "";
  }
  // Seçimden sonra zamanı ilerletir; öğlenden sonra akşam hesabı gelir
  function ilerle(o) {
    o.anIndex++;
    if (ANLAR[o.anIndex] === "gece") return "aksam";
    if (o.anIndex >= ANLAR.length) { o.gun++; o.anIndex = 0; }
    return "kart";
  }
  // Bu akşamın dökümü (durumu değiştirmez); son ekrandaki günlük net gelir de buradan gelir
  function aksamDokum(o) {
    const yuz = n => Math.round(n / 100) * 100;
    const arti = o.gelirler.filter(g => g.tutar > 0), eksi = o.gelirler.filter(g => g.tutar < 0);
    const ham = arti.reduce((t, g) => t + g.tutar, 0);
    const guvenFark = o.guven >= GUVEN_YUKSEK ? yuz(ham * 0.25) : o.guven < GUVEN_DUSUK ? -yuz(ham * 0.3) : 0;
    const izleme = o.suphe >= SUPHE_IZLEME ? (o.suphe - 40) * 150 : 0;
    return { arti, eksi, guvenFark, izleme, net: ham + eksi.reduce((t, g) => t + g.tutar, 0) + guvenFark - izleme };
  }
  function aksamHesapla(o) {
    const h = aksamDokum(o);
    h.ilkIzleme = h.izleme > 0 && !o.bayraklar.izleme;
    if (h.izleme) o.bayraklar.izleme = true;
    h.once = o.kasa;
    o.kasa += h.net;
    return h;
  }
  // Köprü kamyonetle idare edilirken akşam hesabında tamir ettirilebilir
  const KOPRU_TAMIR = 15000;
  const kopruTamirEdilebilir = o => gelirVar(o, "kopru") && o.kasa >= KOPRU_TAMIR;
  function kopruTamir(o) {
    o.kasa -= KOPRU_TAMIR;
    o.gelirler = o.gelirler.filter(g => g.kaynak !== "kopru");
    o.bayraklar.kopru = true;
  }
  function sinirKontrol(o) {
    if (o.kasa < 0) return "kasa";
    if (o.guven <= 0) return "guven";
    if (o.suphe >= 100) return "suphe";
    return null;
  }
  const ipucuVar = (o, tur) => o.ipuclari.some(i => i.tur === tur);
  const cozuldu = o => ipucuVar(o, "belge") && ipucuVar(o, "kopya") && ipucuVar(o, "tanik");
  // Toplanan izlerle hâlâ uyuşan şüpheliler (izler doğru olduğu için hain hep içinde kalır)
  const adaylar = o => o.ipuclari.reduce((l, i) => i.kume ? l.filter(k => i.kume.includes(k)) : l, SUPHELILER.slice());
  function yeniDurum(isim, hain) {
    return {
      surum: 2, isim: isim || "", gun: 1, anIndex: 0, kasa: 30000, guven: 20, suphe: 10,
      gelirler: [], bayraklar: {}, ipuclari: [], not: "", bitti: null,
      hain: hain || SUPHELILER[Math.floor(Math.random() * SUPHELILER.length)]
    };
  }

  };
  const TUR_ADI = { belge: "Belge", kopya: "Kopya", tanik: "Tanık", iz: "İz", masum: "Açıklama" };
  const COZUM = [

  const tl = n => (n < 0 ? "−₺" : "₺") + Math.abs(n).toLocaleString("tr-TR");
  const $ = id => document.getElementById(id);
  const sayac = ad => { try { window.goatcounter && window.goatcounter.count({ path: "oyun/" + ad, title: ad, event: true }); } catch (e) {} };

  let d, gosterim = 0, eskiKayitVardi = false;
  // Kart değiştikten hemen sonraki dokunuşları yok say (çift dokunuş yanlış kartı seçmesin)
  const hazir = () => performance.now() - gosterim > 400;

  function yeniOyun(isim) { d = yeniDurum(isim); kaydet(); sayac("basla"); }
  function kaydet() { try { localStorage.setItem(KAYIT, JSON.stringify(d)); } catch (e) {} }
  function yukle() {
    try {
      if (localStorage.getItem(ESKI_KAYIT)) { eskiKayitVardi = true; localStorage.removeItem(ESKI_KAYIT); }
      const o = JSON.parse(localStorage.getItem(KAYIT));
      return o && o.surum === 2 ? o : null;
    } catch (e) { return null; }
  }
  function sil() { try { localStorage.removeItem(KAYIT); } catch (e) {} }

  function hudCiz(titreyen) {
    $("hud").hidden = false; $("zaman").hidden = false;
    $("s-gun").textContent = d.gun + "/30";
    $("s-kasa").textContent = tl(d.kasa);
    $("k-kasa").classList.toggle("dusuk", d.kasa < 5000);
    $("s-guven").textContent = d.guven;
    $("s-guven").style.color = d.guven >= GUVEN_YUKSEK ? "var(--yesil)" : d.guven < GUVEN_DUSUK ? "var(--kirmizi)" : "";
    $("s-suphe").style.color = d.suphe >= SUPHE_IZLEME ? "var(--kirmizi)" : "";
    $("s-suphe").textContent = d.suphe;
    $("c-guven").style.width = d.guven + "%";
    $("c-suphe").style.width = d.suphe + "%";
    $("defter-ac").textContent = "Defter" + (d.ipuclari.length ? " · " + d.ipuclari.length + " ipucu" : "");
    (titreyen || []).forEach(id => {
      const el = $(id).parentElement;
      el.classList.remove("titre"); void el.offsetWidth; el.classList.add("titre");
    });
  }

  function etkiRozetleri(e) {
    const r = [];
    const ekle = (yazi, sinif) => r.push(`<span class="${sinif}">${yazi}</span>`);
    const ok = n => (n > 0 ? "▲" : "▼").repeat(Math.abs(n) >= 8 ? 2 : 1);
    const isaret = n => (n > 0 ? "+" : "−") + tl(Math.abs(n));
    if (e.kasa) ekle("Kasa " + isaret(e.kasa), e.kasa > 0 ? "iyi" : "kotu");
    if (e.gelir) ekle("Her akşam " + isaret(e.gelir.tutar), e.gelir.tutar > 0 ? "iyi" : "kotu");
    if (e.gelirSil) ekle("Kaplıcanın bütün geliri biter", "kotu");
    if (e.guven) ekle("Güven " + ok(e.guven), e.guven > 0 ? "iyi" : "kotu");
    if (e.suphe) ekle("Baskı " + ok(e.suphe), e.suphe > 0 ? "kotu" : "iyi");
    if (e.yeniIpucu) ekle("İpucu +" + e.yeniIpucu, "notr");
    if (e.son && e.son !== "demo") ekle("Hikâyen biter", "kotu");
    return r.length ? `<div class="etki">${r.join("")}</div>` : "";
  }

  function kisiBasligi(k) {
    const yuz = k.resim ? `<img src="${k.resim}" alt="">` : k.harf;
    return `<div class="kim"><div class="yuz" aria-hidden="true">${yuz}</div><div><div class="ad">${k.ad}</div><div class="rol">${k.rol}</div></div></div>`;
  }
  function ustNotlar() {
    let h = d.not ? `<p class="onceki">${d.not}</p>` : "";
    if (d.suphe >= 40 && d.suphe < SUPHE_IZLEME) h += `<p class="uyari">Baskı 50'ye yaklaşıyor. 50'de alacaklının adamları köye gelir ve her akşam para alır.</p>`;
    if (d.guven > 0 && d.guven <= 10) h += `<p class="uyari">Güven 0'a inerse kooperatif dağılır.</p>`;
    if (d.kasa >= 0 && d.kasa < 5000) h += `<p class="uyari">Kasa eksiye düşerse oyun biter.</p>`;
    d.not = "";
    return h;
  }

  function kartGoster() {
    const sinir = sinirKontrol(d);
    if (sinir) return bitir(sinir);
    const kart = siradakiKart(d);
    $("an").textContent = "Gün " + d.gun + " · " + AN_ADI[ANLAR[d.anIndex]];
    hudCiz();
    const secimler = [kart.a, kart.b].filter(Boolean).map(s => cozSecim(kart, s, d));
    const metin = typeof kart.metin === "function" ? kart.metin(d) : kart.metin;
    $("kart").innerHTML = `<span class="bant"></span>${ustNotlar()}${kisiBasligi(KISI[kart.kim])}
      <div class="metin">${metin}</div>
      ${kart.gorsel ? `<div class="gorsel">${kart.gorsel.map(g => `<img src="${g}" alt="">`).join("")}</div>` : ""}
      <div class="secenekler">${secimler.map((s, i) => `<button class="secim" data-i="${i}">${s.yazi}${etkiRozetleri(s)}</button>`).join("")}</div>`;
    $("kart").querySelectorAll(".secim").forEach(b => b.addEventListener("click", () => { if (hazir()) sec(kart, secimler[+b.dataset.i], +b.dataset.i); }));
    kaydet();
    tazele();
  }

  function sec(kart, e, i) {
    sayac("kart/" + kart.id + "-" + "ab"[i]);
    const once = { kasa: d.kasa, guven: d.guven, suphe: d.suphe };
    uygula(e, d);
    hudCiz([["kasa", "s-kasa"], ["guven", "s-guven"], ["suphe", "s-suphe"]].filter(([k]) => once[k] !== d[k]).map(([, id]) => id));
    if (e.son === "demo") { kaydet(); return tahminGoster(); }
    if (e.son) return bitir(e.son);
    const sinir = sinirKontrol(d);
    if (sinir) return bitir(sinir);
    if (ilerle(d) === "aksam") { const h = aksamHesapla(d); kaydet(); return aksamGoster(h); }
    if (d.anIndex === 0 && (d.gun === 3 || d.gun === 7)) sayac("gun-" + d.gun);
    kartGoster();
  }

  function aksamGoster(h) {
    $("an").textContent = "Gün " + d.gun + " · " + AN_ADI.aksam;
    hudCiz(h.once !== d.kasa ? ["s-kasa"] : []);
    const satir = (ad, tutar) => `<div class="sonuc-satir"><span>${ad}</span><b style="color:var(--${tutar >= 0 ? "yesil" : "kirmizi"})">${tutar >= 0 ? "+" : ""}${tl(tutar)}</b></div>`;
    let satirlar = h.arti.length ? h.arti.map(g => satir(g.ad, g.tutar)).join("") : `<div class="sonuc-satir"><span>Bugün gelir getiren bir iş yok.</span></div>`;
    satirlar += h.eksi.map(g => satir(g.ad, g.tutar)).join("");
    if (h.guvenFark > 0) satirlar += satir("Köy arkanda (güven " + GUVEN_YUKSEK + " ve üstü, +%25)", h.guvenFark);
    if (h.guvenFark < 0) satirlar += satir((d.gun === 1 ? "Köylü seni henüz tanımıyor" : "Köylü isteksiz") + " (güven " + GUVEN_DUSUK + "'in altında, −%30)", h.guvenFark);
    if (h.izleme) satirlar += satir("Alacaklının adamları köyde (baskı " + SUPHE_IZLEME + " ve üstü)", -h.izleme);
    const kopru = !gelirVar(d, "kopru") ? "" : kopruTamirEdilebilir(d)
      ? `<button class="secim" id="kopru-tamir">Rauf'a köprüyü tamir ettir, sonra geceye geç<div class="etki"><span class="kotu">Kasa −${tl(KOPRU_TAMIR)}</span><span class="iyi">Yarından itibaren nakliye farkı yok</span></div></button><p class="kucuk" style="margin:0">Bu akşamın nakliye farkı yukarıda ödendi.</p>`
      : `<p class="kucuk" style="margin:0">Köprü tamiri ${tl(KOPRU_TAMIR)}. Kasada o kadar para olunca buradan tamir ettirebilirsin.</p>`;
    const ilk = h.ilkIzleme ? `<p class="uyari">Bu akşam şehirden iki adam köye geldi. Baskı 50'nin altına inene kadar her akşam alacaklının payını alacaklar.</p>` : "";
    $("kart").innerHTML = `<span class="bant"></span>${ustNotlar()}
      <div class="metin">Akşam oldu${d.isim ? ", " + d.isim : ""}. Günün hesabı:</div>
      ${ilk}${satirlar}
      <div class="sonuc-satir"><span>Kasa</span><span><span class="eski">${tl(h.once)}</span><b>${tl(d.kasa)}</b></span></div>
      <div class="secenekler" style="margin-top:18px">${kopru}<button class="secim ana" id="devam">Geceye geç</button></div>`;
    kaydet();
    $("devam").addEventListener("click", () => { if (hazir()) kartGoster(); });
    if ($("kopru-tamir")) $("kopru-tamir").addEventListener("click", () => {
      if (!hazir() || !kopruTamirEdilebilir(d)) return;
      kopruTamir(d); sayac("kopru-tamir");
      d.not = "Rauf köprüyü onardı. Kamyonlar yeniden geçiyor, nakliye farkı bitti.";
      kartGoster();
    });
    tazele();
  }

  function cozumHtml(o) {
    return COZUM.map(([tur, yazi]) => `<div class="sonuc-satir"><span>${yazi}</span><b style="color:var(--${ipucuVar(o, tur) ? "yesil" : "kursun"})">${ipucuVar(o, tur) ? "✓" : "?"}</b></div>`).join("");
  }
  function ipucuHtml(o) {
    if (!o.ipuclari.length) return `<p class="kucuk">Henüz ipucu yok. Gece kartları seni kopuk sayfanın peşine düşürür.</p>`;
    return `<ul class="liste ipucu-listesi">${o.ipuclari.map(i => `<li><span class="etiket">${TUR_ADI[i.tur]}</span>${i.metin}</li>`).join("")}</ul>`;
  }
  function supheliHtml(o) {
    return `<p class="kucuk" style="margin:0 0 4px">Bu hafta kimin hangi kapıya anahtarı vardı. Anahtarlar sahiplerinin üstünde duruyor, kimse anahtarını kaybettiğini söylemiyor, kapılar zorlanmamış.${o && bay(o, "anahtar") ? " Senin aldığın yedek anahtar bu tabloyu değiştirmiyor: sen şüpheli değilsin." : ""}</p>` + SUPHELILER.map(k => `<div class="sonuc-satir" style="justify-content:flex-start; align-items:center"><img class="mini" src="img/${k}.webp" alt=""><div><b>${HAIN[k].ad}</b><div class="kucuk" style="color:var(--murekkep)">${HAIN[k].bilinen}</div></div></div>`).join("");
  }
  // Oyuncunun tahminini topladığı izlerle karşılaştırır; gerçeği değil, izlerin neyi desteklediğini söyler
  function tahminHtml(o) {
    const l = adaylar(o), t = o.tahmin, ad = k => HAIN[k].ad, liste = ks => ks.map(ad).join(" ya da ");
    if (!t || t === "bilmiyorum") return `<p>${l.length === 3 ? "Topladığın izler henüz kimseyi elemiyor." : l.length === 1 ? "Aslında topladığın izler tek bir kişide birleşiyordu. Defterine bir daha bak." : "Topladığın izlere göre geriye " + liste(l) + " kalıyor."}</p>`;
    if (!l.includes(t)) return `<p>Tahminin: <b>${ad(t)}</b>. Ama bulduğun bir iz bununla çelişiyor: ${o.ipuclari.find(i => i.kume && !i.kume.includes(t)).metin}</p>`;
    if (l.length === 1) return `<p>Tahminin: <b>${ad(t)}</b>. Topladığın izler yalnız ${HAIN[t].ini} gösteriyor. Tam oyunda bunu kanıtlayıp suçlayabileceksin.</p>`;
    return `<p>Tahminin: <b>${ad(t)}</b>. İzlerin buna uyuyor ama ${liste(l.filter(k => k !== t))} de hâlâ olası. Bir iz daha lazım.</p>`;
  }
  function gelirHtml(o) {
    return o.gelirler.length ? o.gelirler.map(g => `<div class="sonuc-satir"><span>${g.ad}</span><b>${g.tutar > 0 ? "+" : ""}${tl(g.tutar)}</b></div>`).join("") : `<p class="kucuk">Her akşam gelir getiren bir iş yok.</p>`;
  }
  function anlasmaHtml(o, sonEkran) {
    const s = (yazi, tamam, deger) => `<div class="sonuc-satir"><span>${yazi}</span><b style="color:var(--${tamam ? "yesil" : "murekkep"})">${tamam && sonEkran ? "✓" : deger}</b></div>`;
    const net = aksamDokum(o).net, tahmin = o.kasa + net * (30 - o.gun);
    return s("İlk taksit " + tl(HEDEF_KASA), o.kasa >= HEDEF_KASA, "kasan " + tl(o.kasa)) +
      s("Köyün desteği: güven " + GUVEN_YUKSEK, o.guven >= GUVEN_YUKSEK, "şu an " + o.guven) +
      s("Baskı 100'e çıkmasın", o.suphe < 100, "şu an " + o.suphe) +
      `<p class="kucuk" style="margin:6px 0 0">Bugünkü koşullarla her akşam net ${net >= 0 ? "+" : ""}${tl(net)}. Hiçbir şey değişmezse 30. günde kasan yaklaşık ${tl(tahmin)} olur.</p>`;
  }

  function defterAc() {
    if (!d) return;
    const gelir = gelirHtml(d);
    const carpan = d.guven >= GUVEN_YUKSEK ? "Güven 60 ve üstünde: gelir %25 fazla." : d.guven < GUVEN_DUSUK ? "Güven 25'in altında: gelir %30 eksik." : "Güven 25 ile 60 arasında: gelir olduğu gibi.";
    $("defter").innerHTML = `<span class="bant"></span>
      <div class="metin" style="margin-bottom:6px">Defter</div>
      <div class="baslik-k">30. gün anlaşması</div>${anlasmaHtml(d, false)}
      <div class="baslik-k">Her akşam</div>${gelir}<p class="kucuk" style="margin:4px 0 0">${carpan}${d.suphe >= SUPHE_IZLEME ? " Baskı 50'nin üstünde: her akşam " + tl((d.suphe - 40) * 150) + " gidiyor." : ""}</p>
      <div class="baslik-k">Kopuk sayfa</div>${cozumHtml(d)}
      <div class="baslik-k">Şüpheliler hakkında bilinenler</div>${supheliHtml(d)}
      <div class="baslik-k">İpuçları</div>${ipucuHtml(d)}
      <div class="secenekler" style="margin-top:14px"><button class="secim ana" id="defter-kapat">Karta dön</button></div>`;
    $("kart").hidden = true; $("defter").hidden = false;
    $("defter-kapat").addEventListener("click", () => { $("defter").hidden = true; $("kart").hidden = false; window.scrollTo(0, 0); });
    sayac("defter");
    window.scrollTo(0, 0);
  }

  function profil(o, neden) {
    if (neden === "sattin") return "Köyü sattım.";
    let p;
    if (neden === "kasa") p = "Kasayı batırdım.";
    else if (neden === "guven") p = "Köylüyü kaybettim.";
    else if (neden === "suphe") p = "Alacaklıyı erken kapıma getirdim.";
    else if (o.kasa >= 50000 && o.guven < 30) p = "Kasayı doldurdum, köylüyü küstürdüm.";
    else if (o.guven >= 50 && o.kasa < 30000) p = "Karaçam beni sevdi, kasa sevmedi.";
    else if (o.guven >= 50) p = "Köy arkamda.";
    else if (o.suphe >= SUPHE_IZLEME) p = "Alacaklının adamları kapımda.";
    else p = "Köyü ayakta tuttum.";
    return p + " " + (cozuldu(o) ? "Satış yetkisinin izini buldum." : "Gerçeği henüz kaçırıyorum.");
  }

  // Demonun son kararı: oyuncu izleri birleştirip bir isim yazar
  function tahminGoster() {
    $("an").textContent = "Gün 7 · Gece";
    hudCiz();
    $("kart").innerHTML = `<span class="bant"></span>
      <div class="metin">Mektubu açmadan önce defterine bir isim yazıyorsun. Satış yetkisini kim imzalamış olabilir?</div>
      <div class="baslik-k">Şüpheliler hakkında bilinenler</div>${supheliHtml(d)}
      <div class="baslik-k">İpuçların</div>${ipucuHtml(d)}
      <div class="secenekler" style="margin-top:12px">${SUPHELILER.concat("bilmiyorum").map(k => `<button class="secim" data-t="${k}" style="text-align:center">${k === "bilmiyorum" ? "Henüz bilmiyorum" : HAIN[k].ad}</button>`).join("")}</div>`;
    $("kart").querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => {
      if (!hazir()) return;
      if (d.tahmin) return;  // ilk tahmin kalıcı; ölçüm kanıt durumuna göre ayrılır (kaç aday kalmıştı)
      const t = b.dataset.t;
      d.tahmin = t;
      sayac("tahmin/aday" + adaylar(d).length + "-" + (t === "bilmiyorum" ? "yok" : t === d.hain ? "dogru" : "yanlis"));
      bitir("demo");
    }));
    tazele();
  }

  function bitir(neden) {
    if (!d.bitti) sayac("son-" + neden);
    d.bitti = neden; kaydet();
    const s = SONLAR[neden];
    const demo = neden === "demo";
    $("defter").hidden = true; $("kart").hidden = false;
    hudCiz();
    $("an").textContent = demo ? "Demo sonu" : "Oyun bitti";
    const coz = cozuldu(d);
    const gizem = coz
      ? `<p><b>Çözdün:</b> Kopuk sayfa, kooperatif adına hazırlanmış bir satış yetkisi. Biri imzalamış.</p>`
      : `<p>Bir satış hazırlığından şüphelisin ama belgeyi doğrulayamadın.</p>`;
    $("kart").innerHTML = `<span class="bant"></span>
      <div class="metin" style="font-size:34px; margin-bottom:6px">${s.baslik}</div>
      <p class="ozet">"${profil(d, neden)}"</p>
      <p>${s.metin}</p>
      ${s.neden ? `<p class="kucuk">${s.neden}</p>` : ""}
      <div class="baslik-k">Kopuk sayfa</div>${gizem}${cozumHtml(d)}
      ${demo ? `<div class="baslik-k">Kim imzaladı?</div>${tahminHtml(d)}
        <div class="baslik-k">30. gün anlaşmasına göre durumun</div>${anlasmaHtml(d, true)}
        <div class="baslik-k">Elinde kalanlar (her akşam)</div>${gelirHtml(d)}
        <p style="margin-top:14px"><b>Tam oyun hazırlanıyor:</b> 30 gün, mührü bul, haini suçla, 6 farklı son.</p>` : ""}
      <div class="secenekler" style="margin-top:12px">
        <a class="secim ana" href="${FORM}" target="_blank" rel="noopener" style="text-decoration:none">Tam oyun çıkınca haber ver</a>
        <div class="ikili"><button class="secim" id="paylas">Sonucunu paylaş</button><button class="secim" id="tekrar">Baştan oyna</button></div>
      </div>
      <div class="baslik-k">Kısa sorular (isteğe bağlı)</div>${anketHtml(demo)}
      <p class="kucuk" id="anket-tesekkur" hidden>Teşekkürler, not aldık.</p>
      <p class="kucuk" style="margin-top:14px; text-align:center">Sisliova'da neler oluyor? <a href="/">Dizinin kararlarına bak</a></p>`;
    $("kart").querySelectorAll("[data-anket]").forEach(b => b.addEventListener("click", () => {
      const [grup, deger] = b.dataset.anket.split(":");
      sayac(grup === "fiyat" ? "fiyat-" + deger : "anket/" + grup + "-" + deger);
      $("kart").querySelectorAll(`[data-anket^="${grup}:"]`).forEach(x => { x.disabled = true; x.classList.toggle("secili", x === b); });
      $("anket-tesekkur").hidden = false;
    }));
    $("kart").querySelector(".ana").addEventListener("click", () => sayac("form"));
    $("tekrar").addEventListener("click", () => { sayac("tekrar"); sil(); girisGoster(); });
    $("paylas").addEventListener("click", () => paylas(neden));
    tazele();
  }

  // Son ekrandaki tek dokunuşluk sorular; cevaplar sadece ölçüm olayı olarak sayılır
  const ANKET = [
    ["sevdin", "En çok neyi sevdin?", [["gizem", "Gizem"], ["kararlar", "Kararlar"], ["cizimler", "Çizimler"], ["hikaye", "Hikâye"]]],
    ["devam", "Devamını oynamak ister misin?", [["hemen", "Hemen"], ["belki", "Belki"], ["hayir", "Hayır"]]],
    ["fiyat", "30 günlük tam sürüme en fazla ne öderdin?", [["ucretsiz", "Ücretsiz olmalı"], ["29", "₺29"], ["59", "₺59"], ["99", "₺99 ve üstü"]]]
  ];
  function anketHtml(demo) {
    return ANKET.filter(([g]) => demo || g !== "fiyat").map(([g, soru, l]) => `<p class="kucuk" style="margin:10px 0 6px">${soru}</p>
      <div class="anket">${l.map(([d, yazi]) => `<button class="secim" data-anket="${g}:${d}">${yazi}</button>`).join("")}</div>`).join("");
  }

  async function paylas(neden) {
    sayac("paylas");
    const metin = `Karaçam'da ${d.gun}. gün: "${profil(d, neden)}" Sen kaç gün dayanırsın?`;
    const url = "https://kasabayikurtar.com/oyun/";
    try {
      if (navigator.share) { await navigator.share({ title: "Kasabayı Kurtar: Karaçam", text: metin, url }); return; }
      await navigator.clipboard.writeText(metin + " " + url);
      $("paylas").textContent = "Kopyalandı";
    } catch (e) {}
  }

  function girisGoster() {
    $("hud").hidden = true; $("zaman").hidden = true; $("defter").hidden = true; $("kart").hidden = false;
    const eski = yukle();
    const devamEt = eski && !eski.bitti;
    $("kart").innerHTML = `<span class="bant"></span>
      <div class="kucuk" style="font-weight:800; letter-spacing:.08em">KASABAYI KURTAR</div>
      <div class="metin" style="font-size:40px; margin-bottom:8px">Karaçam</div>
      <div class="harita"><img src="img/harita.webp" alt="Karaçam köyünün elle çizilmiş haritası"></div>
      <p>Halan sana bir dağ köyünün kooperatifini bıraktı. <b style="color:var(--kirmizi)">3 milyon lira borçla</b> birlikte. Kooperatif batarsa 52 kişinin evi gider.</p>
      <p>Alacaklı 30 gün verdi: ilk taksit için <b>₺150.000</b> ve arkanda duracak bir köy.</p>
      <ul class="liste kucuk" style="color:var(--murekkep)">
        <li><b>Kasa</b> eksiye düşerse oyun biter.</li>
        <li><b>Güven</b> köylünün sana desteği. 60 ve üstündeyse akşam gelirin %25 artar, 25'in altındaysa %30 düşer. Köylü seni henüz tanımıyor: 20'den başlıyorsun. 0 olursa kooperatif dağılır.</li>
        <li><b>Baskı</b> alacaklının köye ilgisi. 50'yi geçerse adamları gelir, her akşam para alır. 100 olursa erken tahsilat.</li>
        <li>Kooperatif defterinden bir sayfa kopmuş. Gece kartları seni onun peşine düşürür; bulduklarını <b>Defter</b>'de görürsün.</li>
      </ul>
      <p class="kucuk">Bu demo ilk 7 günü içeriyor. Kurgusal bir oyundur.</p>
      ${eskiKayitVardi ? `<p class="uyari">Oyun güncellendi. Eski kaydın bu sürümde açılmıyor, baştan başlaman gerekiyor.</p>` : ""}
      <div class="giris" style="margin-top:auto">
        <label class="kucuk" for="isim">Adın (isteğe bağlı)</label>
        <input id="isim" maxlength="20" autocomplete="off" placeholder="Akşam hesabı seni bu adla çağırır">
        <div class="secenekler">
          ${devamEt ? `<button class="secim ana" id="devam">Kaldığın yerden devam et (Gün ${eski.gun})</button>` : ""}
          <button class="secim ${devamEt ? "" : "ana"}" id="basla" style="text-align:center">${devamEt ? "Yeni oyun" : "Başla"}</button>
        </div>
      </div>`;
    $("basla").addEventListener("click", () => { yeniOyun($("isim").value.trim()); kartGoster(); });
    if (devamEt) $("devam").addEventListener("click", () => { d = eski; sayac("devam"); kartGoster(); });
    tazele();
  }

  function tazele() { gosterim = performance.now(); $("kart").style.animation = "none"; void $("kart").offsetWidth; $("kart").style.animation = ""; window.scrollTo(0, 0); }

  $("defter-ac").addEventListener("click", defterAc);
  girisGoster();
</script>
